version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: codepair-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codepair
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codepair-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codepair-backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codepair_development
      REDIS_URL: redis://redis:6379/1
      RAILS_ENV: development
      PORT: 4000
      JUDGE0_API_URL: https://judge0-ce.p.rapidapi.com
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: rails server -b 0.0.0.0 -p 4000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codepair-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

