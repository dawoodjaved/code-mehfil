version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: codemehfil-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codemehfil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codemehfil-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local LiveKit for multi-user video (dev keys: API key=devkey, secret=secret)
  livekit:
    image: livekit/livekit-server:latest
    container_name: codemehfil-livekit
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codemehfil-backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codemehfil_development
      REDIS_URL: redis://redis:6379/1
      RAILS_ENV: development
      PORT: 4000
      JUDGE0_API_URL: https://judge0-ce.p.rapidapi.com
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_URL: ws://localhost:7880
    depends_on:
      - postgres
      - redis
      - livekit
    volumes:
      - ./backend:/app
    command: rails server -b 0.0.0.0 -p 4000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codemehfil-frontend
    ports:
      - "3005:3005"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      PORT: 3005
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

