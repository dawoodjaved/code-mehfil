# CodePair - Render Blueprint
# Deploy: Connect this repo to Render and use "New Blueprint" to deploy
# Docs: https://render.com/docs/blueprint-spec

services:
  # Rails API Backend
  - type: web
    runtime: ruby
    name: codepair-backend
    rootDir: backend
    plan: free

    buildCommand: bundle install
    preDeployCommand: bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb

    healthCheckPath: /api/health

    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codepair-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: codepair-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Add your Vercel URL(s) after deploying frontend (comma-separated for multiple)
      # Example: https://codepair.vercel.app,https://codepair-xxx.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional: Judge0 API for code execution (get key from rapidapi.com)
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_URL
        value: https://judge0-ce.p.rapidapi.com

  # Redis (for ActionCable WebSockets)
  - type: keyvalue
    name: codepair-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all (backend connects externally on free tier)
    maxmemoryPolicy: noeviction

databases:
  - name: codepair-db
    plan: free
    databaseName: codepair_production
